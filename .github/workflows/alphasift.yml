name: AlphaSift 官方部署测试

on:
  workflow_dispatch:

jobs:
  alphasift:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout AlphaSift
        uses: actions/checkout@v4

      - name: 2. Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 3. Install AlphaSift
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: 4. Check AlphaSift
        run: |
          alphasift --help

      - name: 5. List strategies
        run: |
          alphasift strategies

      - name: 6. Check AlphaSift overview
        run: |
          alphasift overview --explain

      - name: 7. Check data sources
        run: |
          alphasift doctor data-sources

      - name: 8. List strategies
        run: |
          alphasift strategies --explain

      - name: 9. Run dual_low screening
        id: screening
        run: |
          alphasift screen dual_low --explain --no-llm --save-run | tee screen_output.txt
          RUN_ID=$(grep -oE 'run_id=[a-zA-Z0-9]+' screen_output.txt | head -1 | cut -d= -f2)
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "本次 Run ID: $RUN_ID"

      - name: 10. Evaluate saved run
        run: |
          alphasift evaluate "${{ steps.screening.outputs.run_id }}" --explain
