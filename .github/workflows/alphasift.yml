name: AlphaSift 每日智能选股

on:
  workflow_dispatch:

  # 北京时间周一至周五 15:30
  # GitHub Actions 使用 UTC
  # 北京时间 = UTC + 8
  schedule:
    - cron: "30 7 * * 1-5"


permissions:
  contents: read


jobs:

  alphasift:

    runs-on: ubuntu-latest

    env:
      TZ: Asia/Shanghai

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================

      - name: 1. Checkout
        uses: actions/checkout@v4


      # =========================================================
      # 2. Setup Python
      # =========================================================

      - name: 2. Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # =========================================================
      # 3. Install
      # =========================================================

      - name: 3. Install AlphaSift
        run: |

          set -e

          python -m pip install --upgrade pip

          pip install -e .

          pip install -U \
            akshare \
            pandas \
            requests \
            baostock


      # =========================================================
      # 4. List strategies
      # =========================================================

      - name: 4. List strategies
        run: |

          set -e

          echo "========================================"
          echo "AlphaSift 策略列表"
          echo "========================================"

          alphasift strategies


      # =========================================================
      # 5. Generate industry map
      # =========================================================

      - name: 5. Generate industry map
        run: |

          set -e

          mkdir -p data

          python - <<'PY'

          import baostock as bs
          import pandas as pd


          print("=" * 80)
          print("开始获取 A 股行业分类")
          print("=" * 80)


          login = bs.login()


          print(
              "Baostock login:",
              login.error_code,
              login.error_msg
          )


          if login.error_code != "0":

              raise RuntimeError(
                  "Baostock 登录失败："
                  + str(login.error_msg)
              )


          try:

              rs = bs.query_stock_industry()


              print(
                  "query_stock_industry:",
                  rs.error_code,
                  rs.error_msg
              )


              if rs.error_code != "0":

                  raise RuntimeError(
                      "获取行业数据失败："
                      + str(rs.error_msg)
                  )


              rows = []


              while rs.next():

                  rows.append(
                      rs.get_row_data()
                  )


              if not rows:

                  raise RuntimeError(
                      "Baostock 没有返回行业数据"
                  )


              df = pd.DataFrame(
                  rows,
                  columns=rs.fields
              )


              output = pd.DataFrame()


              output["code"] = (

                  df["code"]
                  .astype(str)
                  .str.replace(
                      "sh.",
                      "",
                      regex=False
                  )
                  .str.replace(
                      "sz.",
                      "",
                      regex=False
                  )
                  .str.replace(
                      "bj.",
                      "",
                      regex=False
                  )
                  .str.strip()
                  .str.zfill(6)

              )


              output["industry"] = (

                  df["industry"]
                  .fillna("")
                  .astype(str)
                  .str.strip()

              )


              output["concepts"] = ""


              output = output[
                  output["code"].str.match(
                      r"^\d{6}$"
                  )
              ]


              output = output.drop_duplicates(
                  subset=["code"],
                  keep="first"
              )


              output = output[
                  output["industry"].str.len() > 0
              ]


              if output.empty:

                  raise RuntimeError(
                      "生成的行业映射为空"
                  )


              output.to_csv(
                  "data/industry_map.csv",
                  index=False,
                  encoding="utf-8-sig"
              )


              print(
                  "行业映射完成：",
                  len(output),
                  "只股票"
              )


              print(
                  output.head(10).to_string(
                      index=False
                  )
              )


          finally:

              bs.logout()

              print(
                  "Baostock 已退出"
              )

          PY


      # =========================================================
      # 6. Record existing runs
      # =========================================================

      - name: 6. Record existing runs
        run: |

          set -e

          mkdir -p data/runs

          python - <<'PY'

          import json
          from pathlib import Path


          run_dir = Path(
              "data/runs"
          )


          files = sorted(

              str(
                  p.resolve()
              )

              for p in run_dir.glob(
                  "*.json"
              )

          )


          Path(
              "data/runs_before.json"
          ).write_text(

              json.dumps(
                  files,
                  ensure_ascii=False,
                  indent=2
              ),

              encoding="utf-8"

          )


          print(
              "运行前已有 JSON：",
              len(files)
          )

          PY


      # =========================================================
      # 7. Six official AlphaSift strategies
      # =========================================================

      - name: 7. Daily screening - 6 strategies
        env:
          INDUSTRY_MAP_FILES: ./data/industry_map.csv
          INDUSTRY_PROVIDER: none
        run: |

          set -e

          echo "========================================"
          echo "AlphaSift 六策略开始"
          echo "========================================"


          echo ""
          echo "1/6 balanced_alpha"

          alphasift screen \
            balanced_alpha \
            --no-llm \
            --save-run


          echo ""
          echo "2/6 momentum_quality"

          alphasift screen \
            momentum_quality \
            --no-llm \
            --save-run


          echo ""
          echo "3/6 volume_breakout"

          alphasift screen \
            volume_breakout \
            --no-llm \
            --save-run


          echo ""
          echo "4/6 shrink_pullback"

          alphasift screen \
            shrink_pullback \
            --no-llm \
            --save-run


          echo ""
          echo "5/6 oversold_reversal"

          alphasift screen \
            oversold_reversal \
            --no-llm \
            --save-run


          echo ""
          echo "6/6 capital_heat"

          alphasift screen \
            capital_heat \
            --no-llm \
            --save-run


          echo ""
          echo "========================================"
          echo "六策略执行完成"
          echo "========================================"


      # =========================================================
      # 8. Multi-layer quantitative filtering
      # =========================================================

      - name: 8. Multi-layer quantitative filtering
        if: success()
        run: |

          set -e

          python - <<'PY'

          import json
          import re
          import time
          from pathlib import Path

          import akshare as ak
          import pandas as pd


          # =====================================================
          # 基础工具
          # =====================================================

          def clean_code(value):

              if value is None:
                  return ""

              s = str(value).strip()


              if s.endswith(".0"):
                  s = s[:-2]


              digits = re.sub(
                  r"\D",
                  "",
                  s
              )


              if not digits:
                  return ""


              return digits.zfill(6)


          def safe_float(value):

              if value is None:
                  return None


              try:

                  if pd.isna(value):
                      return None

              except Exception:
                  pass


              try:

                  return float(value)

              except Exception:

                  return None


          def parse_bool(value):

              if isinstance(
                  value,
                  bool
              ):

                  return value


              if value is None:
                  return None


              text = str(
                  value
              ).strip().lower()


              if text in {
                  "true",
                  "1",
                  "yes",
                  "y",
                  "是",
                  "多头",
                  "bullish"
              }:

                  return True


              if text in {
                  "false",
                  "0",
                  "no",
                  "n",
                  "否",
                  "空头",
                  "bearish"
              }:

                  return False


              return None


          def parse_money_yi(value):

              if value is None:
                  return None


              try:

                  if pd.isna(value):
                      return None

              except Exception:
                  pass


              s = str(
                  value
              ).strip().replace(
                  ",",
                  ""
              )


              if not s:
                  return None


              if s in {
                  "-",
                  "--",
                  "None",
                  "nan",
                  "NaN"
              }:

                  return None


              try:

                  if s.endswith("亿"):

                      return float(
                          s[:-1]
                      )


                  if s.endswith("万"):

                      return (
                          float(
                              s[:-1]
                          )
                          / 10000
                      )


                  if s.endswith("千"):

                      return (
                          float(
                              s[:-1]
                          )
                          / 100000
                      )


                  return float(s)

              except Exception:

                  return None


          def normalize_text(value):

              if value is None:
                  return ""


              text = str(
                  value
              ).strip().lower()


              text = re.sub(
                  r"[\s\-_—·•,，。/（）()【】\[\]：:]",
                  "",
                  text
              )


              return text


          def recursive_find(
              obj,
              keys
          ):

              if isinstance(
                  obj,
                  dict
              ):

                  for key in keys:

                      if key in obj:

                          value = obj[key]

                          if value is not None:

                              return value


                  for value in obj.values():

                      result = recursive_find(
                          value,
                          keys
                      )

                      if result is not None:

                          return result


              elif isinstance(
                  obj,
                  list
              ):

                  for value in obj:

                      result = recursive_find(
                          value,
                          keys
                      )

                      if result is not None:

                          return result


              return None


          def collect_candidate_dicts(
              obj,
              result=None
          ):

              if result is None:
                  result = []


              if isinstance(
                  obj,
                  dict
              ):

                  code_value = (

                      obj.get("code")

                      or obj.get("symbol")

                      or obj.get("stock_code")

                      or obj.get("stockCode")

                      or obj.get("ts_code")

                  )


                  if clean_code(
                      code_value
                  ):

                      result.append(
                          obj
                      )


                  for value in obj.values():

                      collect_candidate_dicts(
                          value,
                          result
                      )


              elif isinstance(
                  obj,
                  list
              ):

                  for value in obj:

                      collect_candidate_dicts(
                          value,
                          result
                      )


              return result


          def find_candidates(data):

              candidates = (
                  collect_candidate_dicts(
                      data
                  )
              )


              unique = {}


              for item in candidates:

                  code = clean_code(

                      item.get("code")

                      or item.get("symbol")

                      or item.get("stock_code")

                      or item.get("stockCode")

                      or item.get("ts_code")

                  )


                  if code:

                      unique[
                          code
                      ] = item


              return list(
                  unique.values()
              )


          def flatten_text_values(value):

              result = []


              if value is None:
                  return result


              if isinstance(
                  value,
                  str
              ):

                  text = value.strip()

                  if text:
                      result.append(text)

                  return result


              if isinstance(
                  value,
                  (int, float)
              ):

                  return result


              if isinstance(
                  value,
                  dict
              ):

                  for key in [
                      "name",
                      "title",
                      "concept",
                      "theme",
                      "board",
                      "label"
                  ]:

                      if key in value:

                          result.extend(
                              flatten_text_values(
                                  value[key]
                              )
                          )

                  return result


              if isinstance(
                  value,
                  list
              ):

                  for item in value:

                      result.extend(
                          flatten_text_values(
                              item
                          )
                      )


              return result


          def recursive_collect(
              obj,
              keys
          ):

              result = []


              if isinstance(
                  obj,
                  dict
              ):

                  for key, value in obj.items():

                      if key in keys:

                          result.append(
                              value
                          )


                      result.extend(
                          recursive_collect(
                              value,
                              keys
                          )
                      )


              elif isinstance(
                  obj,
                  list
              ):

                  for value in obj:

                      result.extend(
                          recursive_collect(
                              value,
                              keys
                          )
                      )


              return result


          def get_stock_name(stock):

              value = recursive_find(

                  stock,

                  [
                      "name",
                      "stock_name",
                      "stockName",
                      "security_name",
                      "股票简称"
                  ]

              )


              return (
                  str(value).strip()
                  if value is not None
                  else "-"
              )


          def call_with_retry(
              func,
              name,
              attempts=3,
              delay=5
          ):

              last_error = None


              for attempt in range(
                  1,
                  attempts + 1
              ):

                  try:

                      print(
                          f"{name} 第 {attempt}/{attempts} 次请求"
                      )


                      result = func()


                      if result is None:

                          raise RuntimeError(
                              f"{name} 返回 None"
                          )


                      if hasattr(
                          result,
                          "empty"
                      ) and result.empty:

                          raise RuntimeError(
                              f"{name} 返回空数据"
                          )


                      return result


                  except Exception as exc:

                      last_error = exc

                      print(
                          f"{name} 失败：",
                          exc
                      )


                      if attempt < attempts:

                          time.sleep(
                              delay * attempt
                          )


              raise RuntimeError(
                  f"{name} 连续 {attempts} 次失败："
                  f"{last_error}"
              )


          def percentile_score(
              rank,
              total,
              max_score
          ):

              if not rank or total <= 0:
                  return 0.0


              if total == 1:
                  return max_score


              percentile = (
                  total - rank
              ) / (
                  total - 1
              )


              return max(
                  0.0,
                  min(
                      max_score,
                      percentile * max_score
                  )
              )


          # =====================================================
          # 读取本次新产生的 JSON
          # =====================================================

          run_dir = Path(
              "data/runs"
          )


          before_file = Path(
              "data/runs_before.json"
          )


          before = set()


          if before_file.exists():

              before = set(
                  json.loads(
                      before_file.read_text(
                          encoding="utf-8"
                      )
                  )
              )


          after = sorted(

              [

                  p

                  for p in run_dir.glob(
                      "*.json"
                  )

                  if str(
                      p.resolve()
                  ) not in before

              ],

              key=lambda p:
                  p.stat().st_mtime,

              reverse=True

          )


          print("=" * 80)
          print("本次新产生的策略运行文件")
          print("=" * 80)


          print(
              "新 JSON：",
              len(after)
          )


          # =====================================================
          # 六策略识别
          # =====================================================

          required_strategies = [

              "balanced_alpha",
              "momentum_quality",
              "volume_breakout",
              "shrink_pullback",
              "oversold_reversal",
              "capital_heat"

          ]


          strategy_files = {}


          for path in after:

              try:

                  data = json.loads(
                      path.read_text(
                          encoding="utf-8"
                      )
                  )

              except Exception as exc:

                  print(
                      "JSON读取失败：",
                      path,
                      exc
                  )

                  continue


              strategy = str(
                  data.get(
                      "strategy",
                      ""
                  )
              ).strip()


              path_text = path.stem.lower()


              if strategy not in required_strategies:

                  for expected in required_strategies:

                      if expected in path_text:

                          strategy = expected

                          break


              if strategy in required_strategies:

                  if strategy not in strategy_files:

                      strategy_files[
                          strategy
                      ] = path


          print(
              "识别到策略：",
              sorted(
                  strategy_files.keys()
              )
          )


          missing = [

              strategy

              for strategy
              in required_strategies

              if strategy
              not in strategy_files

          ]


          if missing:

              raise RuntimeError(
                  "以下策略没有产生本次运行结果："
                  + ", ".join(missing)
              )


          # =====================================================
          # 合并六策略候选
          # =====================================================

          all_candidates = {}


          for strategy in required_strategies:

              path = strategy_files[
                  strategy
              ]


              data = json.loads(
                  path.read_text(
                      encoding="utf-8"
                  )
              )


              candidates = find_candidates(
                  data
              )


              print(
                  strategy,
                  "候选：",
                  len(candidates)
              )


              for stock in candidates:

                  code = clean_code(

                      stock.get("code")

                      or stock.get("symbol")

                      or stock.get("stock_code")

                      or stock.get("stockCode")

                      or stock.get("ts_code")

                  )


                  if not code:
                      continue


                  if code not in all_candidates:

                      item = dict(
                          stock
                      )

                      item["code"] = code

                      item["name"] = get_stock_name(
                          stock
                      )

                      item["strategies"] = []

                      all_candidates[
                          code
                      ] = item


                  if strategy not in (
                      all_candidates[
                          code
                      ]["strategies"]
                  ):

                      all_candidates[
                          code
                      ]["strategies"].append(
                          strategy
                      )


          print(
              "六策略合并候选：",
              len(all_candidates)
          )


          if not all_candidates:

              raise RuntimeError(
                  "六个策略没有产生任何候选股票"
              )


          # =====================================================
          # 价格 2～30
          # =====================================================

          price_candidates = {}


          for code, stock in all_candidates.items():

              price = safe_float(

                  recursive_find(

                      stock,

                      [
                          "current_price",
                          "price",
                          "latest_price",
                          "close",
                          "最新价"
                      ]

                  )

              )


              if price is None:
                  continue


              if 2.0 <= price <= 30.0:

                  stock["price"] = price

                  price_candidates[
                      code
                  ] = stock


          print(
              "价格 2～30 元后：",
              len(price_candidates)
          )


          if not price_candidates:

              raise RuntimeError(
                  "价格 2～30 元过滤后没有候选股票"
              )


          # =====================================================
          # 行业映射
          # =====================================================

          industry_df = pd.read_csv(
              "data/industry_map.csv",
              dtype=str
          )


          industry_map = {}


          for _, row in industry_df.iterrows():

              code = clean_code(
                  row.get("code")
              )


              industry = str(
                  row.get(
                      "industry",
                      ""
                  )
              ).strip()


              if code and industry:

                  industry_map[
                      code
                  ] = industry


          print(
              "行业映射：",
              len(industry_map)
          )


          # =====================================================
          # 个股资金流
          # =====================================================

          print("=" * 80)
          print("获取同花顺个股资金流")
          print("=" * 80)


          stock_flow = call_with_retry(

              lambda:
                  ak.stock_fund_flow_individual(
                      symbol="即时"
                  ),

              "个股资金流"

          )


          stock_flow_map = {}


          for _, row in stock_flow.iterrows():

              code = clean_code(
                  row.get("股票代码")
              )


              if not code:
                  continue


              inflow = parse_money_yi(
                  row.get("流入资金")
              )


              outflow = parse_money_yi(
                  row.get("流出资金")
              )


              net = parse_money_yi(
                  row.get("净额")
              )


              turnover = parse_money_yi(
                  row.get("成交额")
              )


              strength = None


              if (
                  net is not None
                  and turnover is not None
                  and turnover > 0
              ):

                  strength = (
                      net
                      / turnover
                      * 100
                  )


              stock_flow_map[
                  code
              ] = {

                  "inflow":
                      inflow,

                  "outflow":
                      outflow,

                  "net":
                      net,

                  "turnover":
                      turnover,

                  "strength":
                      strength

              }


          pd.DataFrame.from_dict(
              stock_flow_map,
              orient="index"
          ).reset_index(
              names="code"
          ).to_csv(
              "data/stock_flow.csv",
              index=False,
              encoding="utf-8-sig"
          )


          # =====================================================
          # 行业资金流
          # =====================================================

          print("=" * 80)
          print("获取同花顺行业资金流")
          print("=" * 80)


          industry_flow = call_with_retry(

              lambda:
                  ak.stock_fund_flow_industry(
                      symbol="即时"
                  ),

              "行业资金流"

          )


          industry_flow_map = {}


          for _, row in industry_flow.iterrows():

              name = str(
                  row.get(
                      "行业",
                      ""
                  )
              ).strip()


              if not name:
                  continue


              net = parse_money_yi(
                  row.get("净额")
              )


              change_pct = safe_float(
                  row.get(
                      "行业-涨跌幅"
                  )
              )


              industry_flow_map[
                  normalize_text(name)
              ] = {

                  "name":
                      name,

                  "net":
                      net,

                  "change_pct":
                      change_pct

              }


          industry_sorted = sorted(

              [

                  item

                  for item
                  in industry_flow_map.values()

                  if item["net"] is not None

              ],

              key=lambda x:
                  x["net"],

              reverse=True

          )


          industry_rank = {

              normalize_text(
                  item["name"]
              ):
                  index + 1

              for index, item
              in enumerate(
                  industry_sorted
              )

          }


          pd.DataFrame(
              industry_sorted
          ).to_csv(
              "data/industry_flow.csv",
              index=False,
              encoding="utf-8-sig"
          )


          # =====================================================
          # 概念资金流
          # =====================================================

          concept_flow_map = {}


          print("=" * 80)
          print("获取同花顺概念资金流")
          print("=" * 80)


          try:

              concept_flow = call_with_retry(

                  lambda:
                      ak.stock_fund_flow_concept(
                          symbol="即时"
                      ),

                  "概念资金流"

              )


              for _, row in concept_flow.iterrows():

                  name = str(
                      row.get(
                          "行业",
                          ""
                      )
                  ).strip()


                  if not name:
                      continue


                  net = parse_money_yi(
                      row.get("净额")
                  )


                  change_pct = safe_float(
                      row.get(
                          "行业-涨跌幅"
                      )
                  )


                  concept_flow_map[
                      normalize_text(name)
                  ] = {

                      "name":
                          name,

                      "net":
                          net,

                      "change_pct":
                          change_pct

                  }


          except Exception as exc:

              print(
                  "⚠️ 概念资金流获取失败：",
                  exc
              )

              print(
                  "继续运行，概念层记为不可用"
              )


          concept_sorted = sorted(

              [

                  item

                  for item
                  in concept_flow_map.values()

                  if item["net"] is not None

              ],

              key=lambda x:
                  x["net"],

              reverse=True

          )


          concept_rank = {

              normalize_text(
                  item["name"]
              ):
                  index + 1

              for index, item
              in enumerate(
                  concept_sorted
              )

          }


          pd.DataFrame(
              concept_sorted
          ).to_csv(
              "data/concept_flow.csv",
              index=False,
              encoding="utf-8-sig"
          )


          # =====================================================
          # 最终筛选
          # =====================================================

          final_candidates = []


          for code, stock in price_candidates.items():

              # -------------------------------------------------
              # 个股资金
              # -------------------------------------------------

              flow = stock_flow_map.get(
                  code
              )


              if not flow:
                  continue


              stock_net = flow.get(
                  "net"
              )


              stock_strength = flow.get(
                  "strength"
              )


              stock_turnover = flow.get(
                  "turnover"
              )


              # 正式硬过滤
              if stock_net is None:
                  continue


              if stock_net <= 0:
                  continue


              # -------------------------------------------------
              # MA
              # -------------------------------------------------

              ma5 = safe_float(
                  recursive_find(
                      stock,
                      [
                          "ma5",
                          "MA5"
                      ]
                  )
              )


              ma10 = safe_float(
                  recursive_find(
                      stock,
                      [
                          "ma10",
                          "MA10"
                      ]
                  )
              )


              ma20 = safe_float(
                  recursive_find(
                      stock,
                      [
                          "ma20",
                          "MA20"
                      ]
                  )
              )


              ma_bullish = None


              if (
                  ma5 is not None
                  and ma10 is not None
                  and ma20 is not None
              ):

                  ma_bullish = (
                      ma5 > ma10 > ma20
                  )


              else:

                  explicit_ma = recursive_find(

                      stock,

                      [
                          "ma_bullish",
                          "maBullish"
                      ]

                  )


                  ma_bullish = parse_bool(
                      explicit_ma
                  )


                  if ma_bullish is None:

                      status = recursive_find(

                          stock,

                          [
                              "ma_alignment",
                              "ma_status",
                              "trend_status"
                          ]

                      )


                      if status is not None:

                          text = normalize_text(
                              status
                          )


                          if any(

                              keyword in text

                              for keyword in [
                                  "空头",
                                  "bearish",
                                  "downtrend"
                              ]

                          ):

                              ma_bullish = False


                          elif any(

                              keyword in text

                              for keyword in [
                                  "多头",
                                  "bullish",
                                  "uptrend"
                              ]

                          ):

                              ma_bullish = True


              if ma_bullish is not True:

                  continue


              # -------------------------------------------------
              # MACD
              # -------------------------------------------------

              macd_dif = safe_float(

                  recursive_find(

                      stock,

                      [
                          "macd_dif",
                          "MACD_DIF",
                          "dif",
                          "DIF"
                      ]

                  )

              )


              macd_dea = safe_float(

                  recursive_find(

                      stock,

                      [
                          "macd_dea",
                          "MACD_DEA",
                          "dea",
                          "DEA"
                      ]

                  )

              )


              macd_bar = safe_float(

                  recursive_find(

                      stock,

                      [
                          "macd_bar",
                          "MACD_BAR",
                          "histogram",
                          "macd_hist"
                      ]

                  )

              )


              macd_status = recursive_find(

                  stock,

                  [
                      "macd_status",
                      "macd_signal"
                  ]

              )


              macd_bullish = None


              if (
                  macd_dif is not None
                  and macd_dea is not None
              ):

                  macd_bullish = (
                      macd_dif > macd_dea
                  )


                  if (
                      macd_bar is not None
                      and macd_bar < 0
                  ):

                      macd_bullish = False


              explicit_macd = recursive_find(

                  stock,

                  [
                      "macd_bullish",
                      "macdBullish"
                  ]

              )


              explicit_macd_bool = parse_bool(
                  explicit_macd
              )


              if explicit_macd_bool is False:

                  macd_bullish = False


              if (
                  isinstance(
                      macd_status,
                      str
                  )
              ):

                  status_text = normalize_text(
                      macd_status
                  )


                  if any(

                      keyword in status_text

                      for keyword in [
                          "空头",
                          "bearish",
                          "negative",
                          "deadcross",
                          "死叉"
                      ]

                  ):

                      macd_bullish = False


                  elif any(

                      keyword in status_text

                      for keyword in [
                          "多头",
                          "bullish",
                          "positive",
                          "golden",
                          "金叉"
                      ]

                  ):

                      if macd_bullish is None:

                          macd_bullish = True


              if macd_bullish is not True:

                  continue


              # -------------------------------------------------
              # 行业
              # -------------------------------------------------

              industry = industry_map.get(
                  code,
                  ""
              )


              industry_key = normalize_text(
