name: AlphaSift 官方部署测试

on:
  workflow_dispatch:

jobs:
  alphasift:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout AlphaSift
        uses: actions/checkout@v4

      - name: 2. Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 3. Install AlphaSift
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: 4. Check AlphaSift
        run: |
          alphasift --help

      - name: 5. List strategies
        run: |
          alphasift strategies

      - name: 6. Check AlphaSift overview
        run: |
          alphasift overview --explain

      - name: 7. Check data sources
        run: |
          alphasift doctor data-sources

      - name: 8. List strategies
        run: |
          alphasift strategies --explain
