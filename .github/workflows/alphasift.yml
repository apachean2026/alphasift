name: 测试资金流金额解析

on:
  workflow_dispatch:

jobs:
  fund-flow-parse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install akshare pandas

      - name: 测试同花顺个股资金流金额解析
        run: |
          python - <<'PY'
          import akshare as ak
          import pandas as pd
          import re

          print("=" * 80)
          print("同花顺个股资金流金额解析测试")
          print("=" * 80)

          # --------------------------------------------------
          # 金额统一转换为“亿元”
          # --------------------------------------------------
          def parse_money(value):
              if pd.isna(value):
                  return None

              s = str(value).strip().replace(",", "")

              if not s:
                  return None

              try:
                  # 亿元
                  if s.endswith("亿"):
                      return float(s[:-1])

                  # 万元 -> 亿元
                  if s.endswith("万"):
                      return float(s[:-1]) / 10000

                  # 千元 -> 亿元
                  if s.endswith("千"):
                      return float(s[:-1]) / 100000

                  # 纯数字
                  return float(s)

              except Exception:
                  print(f"无法解析金额: {repr(value)}")
                  return None


          print("\n[1] 获取同花顺个股资金流")

          df = ak.stock_fund_flow_individual(symbol="即时")

          print(f"数据行数：{len(df)}")
          print(f"字段：{list(df.columns)}")


          # --------------------------------------------------
          # 测试股票
          # --------------------------------------------------
          test_codes = [
              "600150",
              "300308",
              "600519",
              "300750",
          ]

          print("\n" + "=" * 80)
          print("[2] 测试资金字段原始值 + 解析结果")
          print("=" * 80)


          for code in test_codes:

              print("\n" + "-" * 80)
              print(f"股票代码：{code}")

              stock_code = int(code)

              rows = df[df["股票代码"] == stock_code]

              if rows.empty:
                  print("❌ 没有找到股票")
                  continue

              row = rows.iloc[0]

              print(f"股票简称：{row['股票简称']}")

              print("\n原始资金字段：")

              print("流入资金：", repr(row["流入资金"]))
              print("流出资金：", repr(row["流出资金"]))
              print("净额：    ", repr(row["净额"]))
              print("成交额：  ", repr(row["成交额"]))

              inflow = parse_money(row["流入资金"])
              outflow = parse_money(row["流出资金"])
              net = parse_money(row["净额"])
              turnover = parse_money(row["成交额"])

              print("\n解析为亿元：")

              print("流入资金：", inflow)
              print("流出资金：", outflow)
              print("净额：    ", net)
              print("成交额：  ", turnover)

              if net is not None and turnover not in (None, 0):

                  strength = net / turnover * 100

                  print("\n资金流强度：")
                  print(f"{strength:.2f}%")

                  if strength > 0:
                      print("资金方向：净流入")
                  elif strength < 0:
                      print("资金方向：净流出")
                  else:
                      print("资金方向：持平")

              print("-" * 80)


          print("\n" + "=" * 80)
          print("测试完成")
          print("=" * 80)

          PY
