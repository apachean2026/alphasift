              score = 0.0


              # 1. 策略共振 0～25
              strategy_count = len(

                  set(
                      stock.get(
                          "strategies",
                          []
                      )
                  )

              )


              score += min(
                  strategy_count * 5,
                  25
              )


              # 2. MA 15
              score += 15


              # 3. MACD 15
              score += 15


              # 4. 个股资金 10
              score += 10


              # 5. 个股资金强度 0～10
              if stock_strength is not None:

                  strength_score = max(

                      0.0,

                      min(
                          10.0,
                          5.0
                          + stock_strength
                          * 2.0
                      )

                  )

                  score += strength_score


              # 6. 行业资金 0～10
              if industry_net is not None:

                  if industry_net > 0:

                      score += 10


                  elif industry_net == 0:

                      score += 3


              # 7. 主题/概念 0～10
              theme_concept_score = (
                  theme_score
              )


              if concept_net is not None:

                  if concept_net > 0:

                      theme_concept_score += 5

                  elif concept_net < 0:

                      theme_concept_score -= 3


              if (
                  industry_change is not None
                  and industry_net is not None
                  and industry_change > 0
                  and industry_net > 0
              ):

                  score += 2


              score += max(
                  0.0,
                  min(
                      10.0,
                      theme_concept_score
                  )
              )


              score = max(
                  0.0,
                  min(
                      100.0,
                      score
                  )
              )


              # =================================================
              # 保存字段
              # =================================================

              stock["name"] = get_stock_name(
