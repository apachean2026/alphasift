                  if not top5:

                      raise RuntimeError(
                          "Gemini没有返回任何合法候选"
                      )


                  gemini_status = (
                      "Gemini排序成功"
                  )


              except Exception as exc:

                  print(
                      "⚠️ Gemini失败：",
                      exc
                  )


                  top5 = build_fallback()


                  gemini_status = (
                      "Gemini失败，"
                      "使用量化Top5"
                  )


          # =====================================================
          # 保存
          # =====================================================

          Path(
              "data/gemini_top5.json"
          ).write_text(

              json.dumps(
                  top5,
                  ensure_ascii=False,
                  indent=2
              ),

              encoding="utf-8"

          )


          Path(
              "data/gemini_status.txt"
          ).write_text(

              gemini_status,

              encoding="utf-8"

          )


          print("=" * 80)
          print("最终 Top5")
          print("=" * 80)


          print(
              "状态：",
              gemini_status
          )


          for item in top5:

              print(
                  item.get("rank"),
                  item.get("code"),
                  item.get("name"),
                  item.get("score"),
                  item.get("source"),
                  item.get("reason")
              )

          PY


      # =========================================================
      # 10. Send final Top5 to Feishu
      # =========================================================

      - name: 10. Send final Top5 to Feishu
        if: success()
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |

          set -e

          python - <<'PY'

          import json
          import os
          from pathlib import Path

          import requests


          webhook = os.environ.get(
              "FEISHU_WEBHOOK_URL",
              ""
          ).strip()


          if not webhook:

              print(
                  "⚠️ 未配置 FEISHU_WEBHOOK_URL"
              )

              raise SystemExit(0)


          top5 = json.loads(

              Path(
                  "data/gemini_top5.json"
              ).read_text(
                  encoding="utf-8"
              )

          )


          candidates = json.loads(

              Path(
                  "data/final_candidates.json"
              ).read_text(
                  encoding="utf-8"
              )

          )


          candidate_map = {

              str(
                  item.get(
                      "code",
                      ""
                  )
              ).zfill(6):
                  item

              for item in candidates

          }


          status_file = Path(
              "data/gemini_status.txt"
          )


          gemini_status = (

              status_file.read_text(
                  encoding="utf-8"
              ).strip()

              if status_file.exists()

              else "未知"

          )


          lines = []


          lines.append(
              "📊 AlphaSift 每日智能选股"
          )


          lines.append("")

          lines.append(
              "🧠 六策略 + 技术 + 资金 + Gemini"
          )


          lines.append("")

          lines.append(
              f"Gemini状态：{gemini_status}"
          )


          lines.append("")

          lines.append(
              "筛选流程："
          )


          lines.extend([

              "6个AlphaSift策略",
              "↓",
              "价格 2～30元",
              "↓",
              "MA5 > MA10 > MA20",
              "↓",
              "MACD多头",
              "↓",
              "个股资金净流入",
              "↓",
              "行业资金流",
              "↓",
              "概念资金流",
              "↓",
              "主题/板块热度",
              "↓",
              "量化综合评分",
              "↓",
              "Gemini",
              "↓",
              "最终Top5"

          ])


          lines.append("")

          lines.append(
              "━━━━━━━━━━━━━━━━"
          )


          for item in top5:

              code = str(
                  item.get(
                      "code",
                      ""
                  )
              ).zfill(6)


              detail = candidate_map.get(
                  code,
                  {}
              )


              name = detail.get(
                  "name",
                  item.get(
                      "name",
                      "-"
                  )
              )


              lines.append("")


              lines.append(

                  f"🏆 {item.get('rank', '-')}. "
                  f"{name}（{code}）"

              )


              lines.append(

                  f"评分："
                  f"{item.get('score', '-')}"

              )


              lines.append(

                  f"来源："
                  f"{item.get('source', '-')}"

              )


              lines.append(

                  f"价格："
                  f"{detail.get('price', '-')}"

              )


              lines.append(

                  f"策略数："
                  f"{len(detail.get('strategies', []))}"

              )


              lines.append(

                  "策略："
                  + ", ".join(
                      detail.get(
                          "strategies",
                          []
                      )
                  )

              )


              lines.append(

                  f"MA："
                  f"{detail.get('ma5', '-')}"
                  " > "
                  f"{detail.get('ma10', '-')}"
                  " > "
                  f"{detail.get('ma20', '-')}"

              )


              lines.append(

                  f"MACD："
                  f"{detail.get('macd_status') or detail.get('macd_bullish', '-')}"

              )


              lines.append(

                  f"个股净流入："
                  f"{detail.get('stock_net', '-')}"
                  "亿元"

              )


              lines.append(

                  f"资金强度："
                  f"{detail.get('stock_strength', '-')}"
                  "%"

              )


              lines.append(

                  f"行业："
                  f"{detail.get('industry', '-')}"

              )


              lines.append(

                  f"行业净流入："
                  f"{detail.get('industry_net', '-')}"
                  "亿元"

              )


              lines.append(

                  f"主题评分："
                  f"{detail.get('theme_score', '-')}"

              )


              concepts = detail.get(
                  "concepts",
                  []
              )


              if concepts:

                  lines.append(

                      "概念："
                      + ", ".join(
                          concepts[:5]
                      )

                  )


              if detail.get(
                  "concept_net"
              ) is not None:

                  lines.append(

                      f"概念净流入："
                      f"{detail.get('concept_net')}"
                      "亿元"

                  )


              lines.append(

                  f"AI判断："
                  f"{item.get('reason', '-')}"

              )


              lines.append("")

              lines.append(
                  "━━━━━━━━━━━━━━━━"
              )


          lines.append("")

          lines.append(
              "⏰ 自动运行："
              "北京时间工作日15:30"
          )


          lines.append("")

          lines.append(

              "⚠️ 本结果为程序化量化筛选及AI排序，"
              "不构成投资建议。"

          )


          message = "\n".join(
              lines
          )


          print(
              "========== 飞书最终消息 =========="
          )


          print(message)


          print(
              "=================================="
          )


          payload = {

              "msg_type":
                  "text",

              "content": {

                  "text":
                      message

              }

          }


          response = requests.post(

              webhook,

              json=payload,

              timeout=20

          )


          print(
              "Feishu HTTP:",
              response.status_code
          )


          print(
              "Feishu response:",
              response.text
          )


          response.raise_for_status()


          try:

              result = response.json()


              if result.get(
                  "code"
              ) not in (
                  None,
                  0
              ):

                  raise RuntimeError(
                      "飞书返回错误："
                      + str(result)
                  )


          except ValueError:

              pass


          print(
              "✅ 最终 Top5 已发送到飞书"
          )

          PY


      # =========================================================
      # 11. Upload final results
      # =========================================================

      - name: 11. Upload final results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alphasift-final-results
          path: |
            data/industry_map.csv
            data/stock_flow.csv
            data/industry_flow.csv
            data/concept_flow.csv
            data/final_candidates.csv
            data/final_candidates.json
            data/gemini_top5.json
            data/gemini_status.txt
            data/runs_before.json
            data/runs/*.json
          if-no-files-found: ignore
          retention-days: 14
