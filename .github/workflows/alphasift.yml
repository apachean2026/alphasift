name: AlphaSift 第二资金流数据源测试

on:
  workflow_dispatch:

jobs:

  test-ths-fund-flow:

    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================================================
      # 2. Setup Python
      # =========================================================
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =========================================================
      # 3. 安装 AKShare
      # =========================================================
      - name: Install AKShare
        run: |
          python -m pip install --upgrade pip
          pip install akshare pandas

      # =========================================================
      # 4. 测试第二资金流数据源
      #
      # 数据源：
      # AKShare
      #   ↓
      # 同花顺
      #   ↓
      # 个股资金流
      #
      # 接口：
      # stock_fund_flow_individual(symbol="即时")
      # =========================================================
      - name: 测试第二资金流数据源 - 同花顺
        run: |
          python - <<'PY'
          import akshare as ak
          import pandas as pd
          import traceback

          print("=" * 70)
          print("开始测试第二资金流数据源")
          print("数据链路：GitHub Actions → AKShare → 同花顺")
          print("=" * 70)

          try:

              print("")
              print("正在调用：")
              print('ak.stock_fund_flow_individual(symbol="即时")')
              print("")

              df = ak.stock_fund_flow_individual(symbol="即时")

              print("=" * 70)
              print("接口调用成功")
              print("=" * 70)

              if df is None:
                  print("❌ 返回结果为 None")
                  raise RuntimeError("接口返回 None")

              if df.empty:
                  print("❌ 返回 DataFrame 为空")
                  raise RuntimeError("接口返回空数据")

              print("")
              print("数据行数：", len(df))
              print("数据列：")
              print(list(df.columns))

              print("")
              print("=" * 70)
              print("前 5 行数据")
              print("=" * 70)

              print(df.head(5).to_string(index=False))

              # -------------------------------------------------
              # 查找平安银行
              # -------------------------------------------------

              print("")
              print("=" * 70)
              print("开始查找测试股票：000001 平安银行")
              print("=" * 70)

              code_col = None

              for col in df.columns:
                  col_text = str(col)

                  if "股票代码" in col_text:
                      code_col = col
                      break

              if code_col is None:
                  print("⚠️ 没有找到“股票代码”字段")
                  print("实际字段：", list(df.columns))
              else:

                  print("股票代码字段：", code_col)

                  code_series = (
                      df[code_col]
                      .astype(str)
                      .str.replace(".0", "", regex=False)
                      .str.zfill(6)
                  )

                  target = df[code_series == "000001"]

                  if target.empty:

                      print("")
                      print("⚠️ 没有找到 000001 平安银行")

                      # 尝试名称查找
                      name_col = None

                      for col in df.columns:
                          if "股票简称" in str(col):
                              name_col = col
                              break

                      if name_col:
                          target = df[
                              df[name_col].astype(str).str.contains(
                                  "平安银行",
                                  na=False
                              )
                          ]

                  if target.empty:

                      print("❌ 最终没有找到平安银行")
                      print("")
                      print("这不代表资金流接口失败。")
                      print("因为接口本身已经成功返回数据。")

                  else:

                      print("")
                      print("=" * 70)
                      print("找到平安银行")
                      print("=" * 70)

                      print(target.to_string(index=False))

                      row = target.iloc[0]

                      print("")
                      print("=" * 70)
                      print("资金流核心字段")
                      print("=" * 70)

                      for col in df.columns:

                          name = str(col)

                          if any(
                              keyword in name
                              for keyword in [
                                  "流入资金",
                                  "流出资金",
                                  "净额",
                                  "成交额"
                              ]
                          ):

                              print(
                                  f"{name} = {row.get(col)}"
                              )

              # -------------------------------------------------
              # 自动检查资金流字段
              # -------------------------------------------------

              print("")
              print("=" * 70)
              print("资金流字段检查")
              print("=" * 70)

              flow_keywords = [
                  "流入资金",
                  "流出资金",
                  "净额",
                  "资金"
              ]

              found_columns = []

              for col in df.columns:

                  col_text = str(col)

                  if any(
                      keyword in col_text
                      for keyword in flow_keywords
                  ):
                      found_columns.append(col)

              if found_columns:

                  print("✅ 找到资金流字段：")

                  for col in found_columns:
                      print("   -", col)

              else:

                  print("❌ 没有找到资金流字段")
                  raise RuntimeError("没有发现资金流字段")

              # -------------------------------------------------
              # 最终测试结果
              # -------------------------------------------------

              print("")
              print("=" * 70)
              print("第二资金流数据源测试结果")
              print("=" * 70)

              print("✅ AKShare 调用成功")
              print("✅ 同花顺接口返回数据")
              print("✅ 返回数据非空")
              print("✅ 已检测资金流字段")

              print("")
              print("结论：")
              print("第二资金流数据源基本可用。")

              print("=" * 70)

          except Exception as e:

              print("")
              print("=" * 70)
              print("❌ 第二资金流数据源测试失败")
              print("=" * 70)

              print("异常类型：", type(e).__name__)
              print("异常信息：", repr(e))

              print("")
              print("完整错误：")

              traceback.print_exc()

              print("")
              print("=" * 70)
              print("结论")
              print("=" * 70)

              print("GitHub Actions 当前无法稳定访问该资金流数据源。")

              raise
          PY
