              )


              stock["industry"] = industry


              stock["stock_net"] = stock_net

              stock["stock_strength"] = (
                  stock_strength
              )

              stock["stock_turnover"] = (
                  stock_turnover
              )


              stock["industry_net"] = (
                  industry_net
              )

              stock["industry_change_pct"] = (
                  industry_change
              )

              stock["industry_rank"] = (
                  industry_position
              )


              stock["theme_heat"] = (
                  theme_heat
              )

              stock["theme_score"] = (
                  round(
                      theme_score,
                      2
                  )
              )


              stock["concepts"] = (
                  candidate_concepts
              )

              stock["concept_details"] = (
                  concept_details
              )

              stock["concept_net"] = (
                  concept_net
              )


              stock["ma5"] = ma5

              stock["ma10"] = ma10

              stock["ma20"] = ma20

              stock["ma_bullish"] = (
                  ma_bullish
              )


              stock["macd_dif"] = (
                  macd_dif
              )

              stock["macd_dea"] = (
                  macd_dea
              )

              stock["macd_bar"] = (
                  macd_bar
              )

              stock["macd_status"] = (
                  macd_status
              )

              stock["macd_bullish"] = (
                  macd_bullish
              )


              stock["quant_score"] = round(
                  score,
                  2
              )


              final_candidates.append(
                  stock
              )


          # =====================================================
          # 最终排序
          # =====================================================

          final_candidates.sort(

              key=lambda x:
                  (
                      x.get(
                          "quant_score",
                          0
                      ),

                      len(
                          x.get(
                              "strategies",
                              []
                          )
                      ),

                      x.get(
                          "stock_net",
                          0
                      )

                  ),

              reverse=True

          )


          print("=" * 80)
          print("最终量化筛选")
          print("=" * 80)


          print(
