name: AlphaSift 每日选股

on:
  workflow_dispatch:

  schedule:
    - cron: "30 7 * * 1-5"

jobs:
  alphasift:

    runs-on: ubuntu-latest

    steps:

      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 3. Install AlphaSift
        run: |
          pip install -e .

      - name: 4. List strategies
        run: |
          alphasift strategies

      - name: 5. Quickstart
        run: |
          alphasift quickstart

      - name: 6. Daily screening
        run: |
          alphasift screen dual_low --no-llm --save-run
