                      ]

                  )

              )


              theme_score = 0.0


              if theme_heat is not None:

                  if 0 <= theme_heat <= 1:

                      theme_score = (
                          theme_heat * 5
                      )

                  elif 0 <= theme_heat <= 100:

                      theme_score = (
                          theme_heat / 100 * 5
                      )

                  else:

                      theme_score = 5.0


              # -------------------------------------------------
              # 股票概念
              # -------------------------------------------------

              concept_values = recursive_collect(

                  stock,

                  [
                      "concepts",
                      "concept",
                      "themes",
                      "theme",
                      "boards",
                      "board"
                  ]

              )


              candidate_concepts = []


              for value in concept_values:

                  candidate_concepts.extend(
                      flatten_text_values(
                          value
                      )
                  )


              candidate_concepts = list(

                  dict.fromkeys(

                      [
                          x.strip()
                          for x in candidate_concepts
                          if x.strip()
                      ]

                  )

              )


              matched_concepts = []


              for concept in candidate_concepts:

                  key = normalize_text(
                      concept
                  )


                  if key in concept_flow_map:

                      matched_concepts.append(
                          key
                      )


              concept_details = []


              for key in matched_concepts:

                  info = concept_flow_map[
                      key
                  ]


                  concept_details.append({

                      "name":
                          info["name"],

                      "net":
                          info["net"],

                      "change_pct":
                          info["change_pct"],

                      "rank":
                          concept_rank.get(
