name: AlphaSift 每日选股

on:
  workflow_dispatch:

  # 北京时间周一至周五 15:30
  # GitHub Actions 使用 UTC
  # 北京时间 = UTC + 8
  schedule:
    - cron: "30 7 * * 1-5"

jobs:
  alphasift:

    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: 1. Checkout
        uses: actions/checkout@v4

      # =========================================================
      # 2. Setup Python
      # =========================================================
      - name: 2. Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =========================================================
      # 3. Install AlphaSift
      # =========================================================
      - name: 3. Install AlphaSift
        run: |
          pip install -e .

      # =========================================================
      # 4. List strategies
      # =========================================================
      - name: 4. List strategies
        run: |
          alphasift strategies

      # =========================================================
      # 5. Daily screening
      # =========================================================
      - name: 5. Daily screening
        run: |
          alphasift screen dual_low --no-llm --save-run

      # =========================================================
      # 6. Find latest saved run
      # =========================================================
      - name: 6. Find latest AlphaSift run
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import os

          run_dir = Path("data/runs")

          if not run_dir.exists():
              raise SystemExit("错误：data/runs 目录不存在")

          files = list(run_dir.glob("*.json"))

          if not files:
              raise SystemExit("错误：没有找到 AlphaSift run JSON")

          latest = max(
              files,
              key=lambda p: p.stat().st_mtime
          )

          print("最新 run 文件：")
          print(latest)

          with latest.open(
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print(
              "Run ID：",
              data.get("run_id", "unknown")
          )

          print(
              "Strategy：",
              data.get("strategy", "unknown")
          )

          print(
              "Snapshot source：",
              data.get("snapshot_source", "unknown")
          )

          with open(
              os.environ["GITHUB_ENV"],
              "a",
              encoding="utf-8"
          ) as env:
              env.write(
                  f"ALPHASIFT_RUN_FILE={latest}\n"
              )

          print(
              "ALPHASIFT_RUN_FILE =",
              latest
          )
          PY

      # =========================================================
      # 7. Send Top 5 to Feishu
      # =========================================================
      - name: 7. Send Top 5 to Feishu
        if: success()
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}

        run: |
          python - <<'PY'
          import json
          import os
          import requests

          webhook = os.environ.get(
              "FEISHU_WEBHOOK_URL"
          )

          if not webhook:
              print(
                  "没有配置 FEISHU_WEBHOOK_URL，"
                  "跳过飞书通知"
              )
              raise SystemExit(0)

          run_file = os.environ.get(
              "ALPHASIFT_RUN_FILE"
          )

          if not run_file:
              raise SystemExit(
                  "错误：没有找到 ALPHASIFT_RUN_FILE"
              )

          print("读取 run：", run_file)

          with open(
              run_file,
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print(
              "Run ID：",
              data.get("run_id", "unknown")
          )

          print(
              "Strategy：",
              data.get("strategy", "unknown")
          )

          # =====================================================
          # 查找股票列表
          # =====================================================
          candidates = None

          possible_fields = [
              "picks",
              "candidates",
              "results",
              "ranked_candidates",
              "selected_stocks",
              "stocks",
              "items",
              "top_picks",
              "ranked"
          ]

          # 顶层寻找
          for field in possible_fields:

              value = data.get(field)

              if isinstance(value, list) and value:

                  candidates = value

                  print(
                      "找到股票列表：",
                      field
                  )

                  break

          # 嵌套寻找
          if candidates is None:

              for parent_name in [
                  "result",
                  "screen_result",
                  "screen",
                  "selection",
                  "portfolio",
                  "data"
              ]:

                  parent = data.get(parent_name)

                  if not isinstance(parent, dict):
                      continue

                  for field in possible_fields:

                      value = parent.get(field)

                      if isinstance(value, list) and value:

                          candidates = value

                          print(
                              "找到股票列表：",
                              parent_name,
                              field
                          )

                          break

                  if candidates is not None:
                      break

          # =====================================================
          # 找不到股票时，把 JSON 结构打印出来
          # =====================================================
          if candidates is None:

              print("")
              print(
                  "没有找到股票列表。"
              )

              print("")
              print(
                  "Run JSON 顶层字段："
              )

              print(
                  list(data.keys())
              )

              print("")
              print(
                  "Run JSON 内容："
              )

              print(
                  json.dumps(
                      data,
                      ensure_ascii=False,
                      indent=2
                  )
              )

              raise SystemExit(
                  "无法从 run JSON 找到股票列表"
              )

          # =====================================================
          # 排序
          # =====================================================
          def get_rank(stock):

              if not isinstance(stock, dict):
                  return 999999

              value = stock.get("rank")

              if value is None:
                  value = stock.get("ranking")

              if value is None:
                  value = stock.get("position")

              try:
                  return int(value)
              except Exception:
                  return 999999

          candidates = sorted(
              candidates,
              key=get_rank
          )

          top5 = candidates[:5]

          if not top5:
              raise SystemExit(
                  "没有找到 Top 5"
              )

          # =====================================================
          # 格式化数字
          # =====================================================
          def number(value, digits=2):

              if value is None:
                  return "-"

              try:
                  return f"{float(value):.{digits}f}"
              except Exception:
                  return str(value)

          # =====================================================
          # 基本信息
          # =====================================================
          run_id = data.get(
              "run_id",
              "unknown"
          )

          strategy = data.get(
              "strategy",
              "dual_low"
          )

          source = data.get(
              "snapshot_source",
              "unknown"
          )

          llm_ranked = data.get(
              "llm_ranked",
              False
          )

          post_analyzers = data.get(
              "post_analyzers",
              []
          )

          # =====================================================
          # 创建飞书消息
          # =====================================================
          lines = []

          lines.append(
              "📊 AlphaSift 每日选股"
          )

          lines.append("")

          lines.append(
              "策略："
              + str(strategy)
              + "（双低选股）"
          )

          lines.append(
              "数据源："
              + str(source)
          )

          if llm_ranked:
              lines.append("LLM：已启用")
          else:
              lines.append("LLM：未启用")

          if post_analyzers:
              lines.append(
                  "后置分析："
                  + ", ".join(
                      str(x)
                      for x in post_analyzers
                  )
              )

          lines.append(
              "Run ID："
              + str(run_id)
          )

          lines.append("")

          lines.append(
              "🏆 今日 Top 5"
          )

          lines.append("")

          # =====================================================
          # Top 5
          # =====================================================
          for index, stock in enumerate(
              top5,
              start=1
          ):

              if not isinstance(stock, dict):
                  continue

              code = (
                  stock.get("code")
                  or stock.get("symbol")
                  or stock.get("stock_code")
                  or "-"
              )

              name = (
                  stock.get("name")
                  or stock.get("stock_name")
                  or "-"
              )

              final_score = stock.get(
                  "final_score"
              )

              if final_score is None:
                  final_score = stock.get(
                      "score"
                  )

              screen_score = stock.get(
                  "screen_score"
              )

              price = stock.get(
                  "price"
              )

              if price is None:
                  price = stock.get(
                      "close"
                  )

              change_pct = stock.get(
                  "change_pct"
              )

              if change_pct is None:
                  change_pct = stock.get(
                      "change"
                  )

              pe = stock.get(
                  "pe_ratio"
              )

              if pe is None:
                  pe = stock.get(
                      "pe"
                  )

              pb = stock.get(
                  "pb_ratio"
              )

              if pb is None:
                  pb = stock.get(
                      "pb"
                  )

              risk = (
                  stock.get("risk_level")
                  or stock.get("risk")
                  or "-"
              )

              lines.append(
                  str(index)
                  + "️⃣ "
                  + str(name)
                  + "（"
                  + str(code)
                  + "）"
              )

              lines.append(
                  "   ⭐ 最终评分："
                  + number(
                      final_score,
                      1
                  )
              )

              if screen_score is not None:
                  lines.append(
                      "   筛选评分："
                      + number(
                          screen_score,
                          1
                      )
                  )

              lines.append(
                  "   💰 价格："
                  + number(
                      price,
                      2
                  )
              )

              lines.append(
                  "   📈 涨跌幅："
                  + number(
                      change_pct,
                      2
                  )
                  + "%"
              )

              lines.append(
                  "   PE："
                  + number(
                      pe,
                      2
                  )
              )

              lines.append(
                  "   PB："
                  + number(
                      pb,
                      2
                  )
              )

              lines.append(
                  "   风险："
                  + str(risk)
              )

              lines.append("")

          lines.append(
              "━━━━━━━━━━━━━━"
          )

          lines.append(
              "✅ AlphaSift 自动选股完成"
          )

          lines.append(
              "⚠️ 以上为程序筛选结果，"
              "不构成投资建议。"
          )

          message = "\n".join(lines)

          # =====================================================
          # 打印最终飞书内容
          # =====================================================
          print("")
          print(
              "========== 飞书消息 =========="
          )

          print(message)

          print(
              "=============================="
          )

          # =====================================================
          # 发送飞书
          # =====================================================
          payload = {
              "msg_type": "text",
              "content": {
                  "text": message
              }
          }

          response = requests.post(
              webhook,
              json=payload,
              timeout=20
          )

          print(
              "Feishu HTTP status:",
              response.status_code
          )

          print(
              "Feishu response:",
              response.text
          )

          response.raise_for_status()

          # =====================================================
          # 检查飞书返回
          # =====================================================
          try:

              result = response.json()

              if result.get("code") not in (
                  None,
                  0
              ):

                  raise RuntimeError(
                      "飞书返回错误："
                      + str(result)
                  )

          except ValueError:
              pass

          print("")
          print(
              "✅ Top 5 已成功发送到飞书"
          )
          PY
