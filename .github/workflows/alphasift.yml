name: 测试同花顺行业与概念资金流

on:
  workflow_dispatch:

jobs:
  test-ths-flow:

    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================================================
      # 2. Python
      # =========================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =========================================================
      # 3. 安装 AKShare
      # =========================================================
      - name: Install AKShare
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade akshare pandas

      # =========================================================
      # 4. 测试同花顺行业资金流
      # =========================================================
      - name: Test THS Industry Fund Flow
        shell: bash
        run: |
          python - <<'PY'
          import akshare as ak
          import pandas as pd
          import traceback

          print("=" * 80)
          print("【1】测试同花顺行业资金流")
          print("=" * 80)

          try:

              if not hasattr(ak, "stock_fund_flow_industry"):
                  raise RuntimeError(
                      "当前 AKShare 不存在 stock_fund_flow_industry"
                  )

              print("AKShare 接口存在：stock_fund_flow_industry")

              attempts = [
                  {"symbol": "即时"},
                  {"symbol": "3日排行"},
                  {"symbol": "5日排行"},
                  {"symbol": "10日排行"},
                  {"symbol": "20日排行"},
              ]

              success = False

              for kwargs in attempts:

                  print("")
                  print("尝试参数：", kwargs)

                  try:

                      df = ak.stock_fund_flow_industry(**kwargs)

                      if df is not None and not df.empty:

                          print("")
                          print("✅ 调用成功")
                          print("参数：", kwargs)
                          print("数据行数：", len(df))

                          print("")
                          print("字段：")
                          print(list(df.columns))

                          print("")
                          print("前 20 行：")
                          print(
                              df.head(20).to_string(index=False)
                          )

                          filename = (
                              "ths_industry_fund_flow_"
                              + kwargs["symbol"]
                              + ".csv"
                          )

                          df.to_csv(
                              filename,
                              index=False,
                              encoding="utf-8-sig"
                          )

                          print("")
                          print("已保存：", filename)

                          success = True
                          break

                      else:

                          print("⚠️ 返回空数据")

                  except Exception as e:

                      print(
                          "❌ 调用失败：",
                          type(e).__name__,
                          repr(e)
                      )

              if not success:

                  print("")
                  print("❌ 同花顺行业资金流所有测试均失败")

          except Exception as e:

              print(
                  "❌ 行业资金流测试异常：",
                  type(e).__name__,
                  repr(e)
              )

              traceback.print_exc()

          print("")
          print("=" * 80)
          PY

      # =========================================================
      # 5. 测试同花顺概念资金流
      # =========================================================
      - name: Test THS Concept Fund Flow
        shell: bash
        run: |
          python - <<'PY'
          import akshare as ak
          import pandas as pd
          import traceback

          print("=" * 80)
          print("【2】测试同花顺概念资金流")
          print("=" * 80)

          try:

              if not hasattr(ak, "stock_fund_flow_concept"):
                  raise RuntimeError(
                      "当前 AKShare 不存在 stock_fund_flow_concept"
                  )

              print("AKShare 接口存在：stock_fund_flow_concept")

              attempts = [
                  {"symbol": "即时"},
                  {"symbol": "3日排行"},
                  {"symbol": "5日排行"},
                  {"symbol": "10日排行"},
                  {"symbol": "20日排行"},
              ]

              success = False

              for kwargs in attempts:

                  print("")
                  print("尝试参数：", kwargs)

                  try:

                      df = ak.stock_fund_flow_concept(**kwargs)

                      if df is not None and not df.empty:

                          print("")
                          print("✅ 调用成功")
                          print("参数：", kwargs)
                          print("数据行数：", len(df))

                          print("")
                          print("字段：")
                          print(list(df.columns))

                          print("")
                          print("前 20 行：")
                          print(
                              df.head(20).to_string(index=False)
                          )

                          filename = (
                              "ths_concept_fund_flow_"
                              + kwargs["symbol"]
                              + ".csv"
                          )

                          df.to_csv(
                              filename,
                              index=False,
                              encoding="utf-8-sig"
                          )

                          print("")
                          print("已保存：", filename)

                          success = True
                          break

                      else:

                          print("⚠️ 返回空数据")

                  except Exception as e:

                      print(
                          "❌ 调用失败：",
                          type(e).__name__,
                          repr(e)
                      )

              if not success:

                  print("")
                  print("❌ 同花顺概念资金流所有测试均失败")

          except Exception as e:

              print(
                  "❌ 概念资金流测试异常：",
                  type(e).__name__,
                  repr(e)
              )

              traceback.print_exc()

          print("")
          print("=" * 80)
          PY

      # =========================================================
      # 6. 上传测试结果
      # =========================================================
      - name: Upload fund flow results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ths-fund-flow-test-results
          path: |
            *.csv
          if-no-files-found: ignore
