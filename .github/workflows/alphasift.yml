name: AlphaSift 第四步板块资金流测试

on:
  workflow_dispatch:

jobs:

  test-sector-fund-flow:

    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================================================
      # 2. Setup Python
      # =========================================================
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =========================================================
      # 3. 安装 AKShare
      # =========================================================
      - name: Install AKShare
        run: |
          python -m pip install --upgrade pip
          pip install akshare pandas

      # =========================================================
      # 4. 测试板块资金流
      #
      # 数据链路：
      #
      # GitHub Actions
      #       ↓
      # AKShare
      #       ↓
      # 东方财富板块资金流
      #       ↓
      # 行业 / 概念板块
      #
      # 注意：
      # 这一阶段只测试，不加入正式选股。
      # =========================================================
      - name: 测试板块资金流
        run: |
          python - <<'PY'
          import akshare as ak
          import pandas as pd
          import traceback

          print("=" * 80)
          print("AlphaSift 第四步：测试板块资金流")
          print("=" * 80)

          # -----------------------------------------------------
          # 资金字符串转换
          # -----------------------------------------------------

          def parse_money(value):

              if pd.isna(value):
                  return None

              text = str(value).strip()

              if text in ("", "-", "--", "nan", "None"):
                  return None

              negative = text.startswith("-")

              text = text.replace(",", "")
              text = text.replace("+", "")
              text = text.replace("-", "")

              try:

                  if "亿" in text:
                      number = float(
                          text.replace("亿", "")
                      ) * 100000000

                  elif "万" in text:
                      number = float(
                          text.replace("万", "")
                      ) * 10000

                  elif "千" in text:
                      number = float(
                          text.replace("千", "")
                      ) * 1000

                  else:
                      number = float(text)

                  return -number if negative else number

              except Exception:
                  return None

          try:

              # =================================================
              # 1. 测试行业板块资金流
              # =================================================

              print("")
              print("=" * 80)
              print("【1】测试行业板块资金流")
              print("=" * 80)

              print("")
              print("调用接口：")
              print("ak.stock_sector_fund_flow_rank(indicator='今日')")
              print("")

              try:

                  industry_df = ak.stock_sector_fund_flow_rank(
                      indicator="今日"
                  )

                  if (
                      industry_df is None
                      or industry_df.empty
                  ):

                      print("❌ 行业板块接口返回空数据")

                  else:

                      print("✅ 行业板块接口调用成功")
                      print(
                          "行业板块数量：",
                          len(industry_df)
                      )

                      print("")
                      print("字段：")
                      print(
                          list(industry_df.columns)
                      )

                      print("")
                      print("=" * 80)
                      print("行业板块前 10 行")
                      print("=" * 80)

                      print(
                          industry_df.head(10)
                          .to_string(index=False)
                      )

              except Exception as e:

                  print("")
                  print("❌ 行业板块接口调用失败")
                  print("异常类型：", type(e).__name__)
                  print("异常信息：", repr(e))

                  industry_df = None

              # =================================================
              # 2. 测试概念板块资金流
              # =================================================

              print("")
              print("=" * 80)
              print("【2】测试概念板块资金流")
              print("=" * 80)

              print("")
              print("调用接口：")
              print("ak.stock_sector_fund_flow_rank(indicator='今日')")
              print("")

              # 说明：
              # 某些 AKShare 版本的该接口默认返回行业/板块排名。
              # 如果没有单独概念参数，则先确认默认板块数据是否正常。

              if (
                  industry_df is not None
                  and not industry_df.empty
              ):

                  print(
                      "当前 AKShare 版本已经成功返回板块资金流数据。"
                  )

              # =================================================
              # 3. 自动识别核心字段
              # =================================================

              print("")
              print("=" * 80)
              print("【3】自动识别板块资金字段")
              print("=" * 80)

              if (
                  industry_df is not None
                  and not industry_df.empty
              ):

                  sector_df = industry_df

                  sector_name_col = None
                  net_col = None
                  inflow_col = None
                  outflow_col = None

                  for col in sector_df.columns:

                      text = str(col)

                      if (
                          "板块" in text
                          or "行业" in text
                          or "名称" in text
                      ):

                          if sector_name_col is None:
                              sector_name_col = col

                      if "净额" in text:
                          net_col = col

                      if "流入" in text:
                          inflow_col = col

                      if "流出" in text:
                          outflow_col = col

                  print(
                      "板块名称字段：",
                      sector_name_col
                  )

                  print(
                      "净额字段：",
                      net_col
                  )

                  print(
                      "流入字段：",
                      inflow_col
                  )

                  print(
                      "流出字段：",
                      outflow_col
                  )

                  # =============================================
                  # 4. 转换净额
                  # =============================================

                  if net_col is not None:

                      sector_df["_net_value"] = (
                          sector_df[net_col]
                          .apply(parse_money)
                      )

                      valid = sector_df.dropna(
                          subset=["_net_value"]
                      )

                      print("")
                      print(
                          "有效板块资金数据：",
                          len(valid)
                      )

                  else:

                      valid = pd.DataFrame()

                      print(
                          "⚠️ 没有自动找到净额字段"
                      )

              else:

                  valid = pd.DataFrame()

              # =================================================
              # 5. 净流入板块 Top 20
              # =================================================

              print("")
              print("=" * 80)
              print("【4】板块资金净流入 Top 20")
              print("=" * 80)

              if not valid.empty:

                  top_inflow = (
                      valid
                      .sort_values(
                          "_net_value",
                          ascending=False
                      )
                      .head(20)
                  )

                  show_cols = [
                      col
                      for col in [
                          sector_name_col,
                          "涨跌幅",
                          inflow_col,
                          outflow_col,
                          net_col
                      ]
                      if col is not None
                      and col in top_inflow.columns
                  ]

                  print(
                      top_inflow[
                          show_cols
                      ].to_string(index=False)
                  )

              else:

                  print(
                      "⚠️ 没有可用于排序的板块资金数据"
                  )

              # =================================================
              # 6. 净流出板块 Top 20
              # =================================================

              print("")
              print("=" * 80)
              print("【5】板块资金净流出 Top 20")
              print("=" * 80)

              if not valid.empty:

                  top_outflow = (
                      valid
                      .sort_values(
                          "_net_value",
                          ascending=True
                      )
                      .head(20)
                  )

                  print(
                      top_outflow[
                          show_cols
                      ].to_string(index=False)
                  )

              else:

                  print(
                      "⚠️ 没有可用于排序的板块资金数据"
                  )

              # =================================================
              # 7. 测试几个重点板块
              # =================================================

              print("")
              print("=" * 80)
              print("【6】重点板块检查")
              print("=" * 80)

              if (
                  not valid.empty
                  and sector_name_col is not None
              ):

                  keywords = [
                      "银行",
                      "证券",
                      "半导体",
                      "通信",
                      "人工智能",
                      "机器人",
                      "电池",
                      "新能源",
                      "军工",
                      "汽车"
                  ]

                  for keyword in keywords:

                      matches = valid[
                          valid[
                              sector_name_col
                          ]
                          .astype(str)
                          .str.contains(
                              keyword,
                              case=False,
                              na=False
                          )
                      ]

                      if not matches.empty:

                          print("")
                          print(
                              f"关键词【{keyword}】:"
                          )

                          print(
                              matches[
                                  show_cols
                              ].head(5)
                              .to_string(
                                  index=False
                              )
                          )

              # =================================================
              # 8. 最终结论
              # =================================================

              print("")
              print("=" * 80)
              print("【7】第四步测试结论")
              print("=" * 80)

              if not valid.empty:

                  print("")
                  print(
                      "✅ GitHub Actions 可以访问板块资金流"
                  )

                  print(
                      "✅ 成功获得板块数据"
                  )

                  print(
                      "✅ 成功获得资金净额字段"
                  )

                  print(
                      "✅ 可以进行板块资金净流入排序"
                  )

                  print("")
                  print(
                      "下一步可以继续研究："
                  )

                  print(
                      "板块资金流 → 股票所属行业 → 个股资金流"
                  )

              else:

                  print("")
                  print(
                      "⚠️ 板块资金流数据没有成功获得"
                  )

                  print(
                      "暂时不能加入正式选股系统"
                  )

              print("")
              print("=" * 80)

          except Exception as e:

              print("")
              print("=" * 80)
              print("❌ 第四步测试发生异常")
              print("=" * 80)

              print(
                  "异常类型：",
                  type(e).__name__
              )

              print(
                  "异常信息：",
                  repr(e)
              )

              traceback.print_exc()

              raise
          PY
