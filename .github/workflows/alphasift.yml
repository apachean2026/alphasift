name: 测试股票代码匹配

on:
  workflow_dispatch:

jobs:
  test-code-match:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AKShare
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade akshare pandas

      - name: Diagnose Stock Code
        shell: bash
        run: |
          python - <<'PY'

          import akshare as ak
          import pandas as pd

          print("=" * 100)
          print("股票代码匹配诊断")
          print("=" * 100)

          # =====================================================
          # 获取个股资金流
          # =====================================================

          print("")
          print("【1】获取个股资金流")

          df = ak.stock_fund_flow_individual(
              symbol="即时"
          )

          print("数据行数：", len(df))
          print("字段：", list(df.columns))

          # =====================================================
          # 查看真实股票代码
          # =====================================================

          print("")
          print("=" * 100)
          print("【2】查看实际股票代码格式")
          print("=" * 100)

          print("股票代码字段类型：")
          print(df["股票代码"].dtype)

          print("")
          print("前 30 个股票代码：")

          print(
              df["股票代码"]
              .head(30)
              .tolist()
          )

          # =====================================================
          # 指定股票
          # =====================================================

          targets = [
              "600150",
              "300308",
              "600519",
              "300750",
          ]

          print("")
          print("=" * 100)
          print("【3】直接搜索指定股票")
          print("=" * 100)

          for code in targets:

              print("")
              print("-" * 100)
              print("目标代码：", code)

              # 方法 1：原始字符串
              mask1 = (
                  df["股票代码"].astype(str)
                  == code
              )

              print(
                  "方法1 原始匹配：",
                  int(mask1.sum()),
                  "条"
              )

              if mask1.any():
                  print(
                      df.loc[mask1].to_string(
                          index=False
                      )
                  )
                  continue

              # 方法 2：去空格
              mask2 = (
                  df["股票代码"]
                  .astype(str)
                  .str.strip()
                  == code
              )

              print(
                  "方法2 strip匹配：",
                  int(mask2.sum()),
                  "条"
              )

              if mask2.any():
                  print(
                      df.loc[mask2].to_string(
                          index=False
                      )
                  )
                  continue

              # 方法 3：补零
              mask3 = (
                  df["股票代码"]
                  .astype(str)
                  .str.strip()
                  .str.zfill(6)
                  == code
              )

              print(
                  "方法3 zfill匹配：",
                  int(mask3.sum()),
                  "条"
              )

              if mask3.any():
                  print(
                      df.loc[mask3].to_string(
                          index=False
                      )
                  )
                  continue

              # 方法 4：包含代码
              mask4 = (
                  df["股票代码"]
                  .astype(str)
                  .str.contains(
                      code,
                      regex=False,
                      na=False
                  )
              )

              print(
                  "方法4 contains匹配：",
                  int(mask4.sum()),
                  "条"
              )

              if mask4.any():
                  print(
                      df.loc[mask4].to_string(
                          index=False
                      )
                  )
                  continue

              print("❌ 四种方式都没有匹配")

          # =====================================================
          # 查看股票代码长度
          # =====================================================

          print("")
          print("=" * 100)
          print("【4】股票代码长度统计")
          print("=" * 100)

          code_lengths = (
              df["股票代码"]
              .astype(str)
              .str.len()
              .value_counts()
              .sort_index()
          )

          print(code_lengths)

          # =====================================================
          # 查看可能包含 600150 / 300308 等的记录
          # =====================================================

          print("")
          print("=" * 100)
          print("【5】模糊搜索")
          print("=" * 100)

          for code in targets:

              result = df[
                  df["股票代码"]
                  .astype(str)
                  .str.contains(
                      code,
                      regex=False,
                      na=False
                  )
              ]

              print("")
              print(
                  "搜索",
                  code,
                  "找到",
                  len(result),
                  "条"
              )

              if not result.empty:
                  print(
                      result.to_string(
                          index=False
                      )
                  )

          print("")
          print("=" * 100)
          print("诊断完成")
          print("=" * 100)

          PY
