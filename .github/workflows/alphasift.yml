name: AlphaSift 第六步板块资金流接口测试

on:
  workflow_dispatch:

jobs:

  test-sector-fund-flow:

    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================================================
      # 2. Setup Python
      # =========================================================
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =========================================================
      # 3. 安装 AKShare
      # =========================================================
      - name: Install AKShare
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade akshare pandas

      # =========================================================
      # 4. 检查实际存在的板块资金流接口
      # =========================================================
      - name: 检查 AKShare 板块资金流接口
        run: |
          python - <<'PY'
          import akshare as ak
          import inspect

          print("=" * 80)
          print("AlphaSift 第六步：检查 AKShare 板块资金流接口")
          print("=" * 80)

          print("")
          print("AKShare 版本：")
          print(getattr(ak, "__version__", "unknown"))

          print("")
          print("当前实际存在的 fund_flow 接口：")
          print("")

          names = [
              x for x in dir(ak)
              if "fund_flow" in x.lower()
              and "sector" in x.lower()
          ]

          for name in sorted(names):

              print(" -", name)

              try:
                  print(
                      "   签名：",
                      inspect.signature(
                          getattr(ak, name)
                      )
                  )
              except Exception:
                  pass

          print("")
          print("=" * 80)
          PY

      # =========================================================
      # 5. 测试 stock_sector_fund_flow_rank
      # =========================================================
      - name: 测试板块资金流排名接口
        run: |
          python - <<'PY'
          import akshare as ak
          import pandas as pd
          import traceback

          print("=" * 80)
          print("【1】测试 stock_sector_fund_flow_rank")
          print("=" * 80)

          try:

              if not hasattr(
                  ak,
                  "stock_sector_fund_flow_rank"
              ):

                  raise RuntimeError(
                      "当前 AKShare 不存在 "
                      "stock_sector_fund_flow_rank"
                  )

              func = ak.stock_sector_fund_flow_rank

              attempts = [
                  {"indicator": "今日"},
                  {"indicator": "5日"},
                  {"indicator": "10日"},
              ]

              success = False

              for kwargs in attempts:

                  print("")
                  print("尝试参数：", kwargs)

                  try:

                      df = func(**kwargs)

                      if (
                          df is not None
                          and not df.empty
                      ):

                          print("")
                          print("✅ 调用成功")
                          print("参数：", kwargs)
                          print("数据行数：", len(df))

                          print("")
                          print("字段：")
                          print(list(df.columns))

                          print("")
                          print("前 10 行：")

                          print(
                              df.head(10)
                              .to_string(index=False)
                          )

                          df.to_csv(
                              "sector_fund_flow_rank.csv",
                              index=False,
                              encoding="utf-8-sig"
                          )

                          success = True
                          break

                      else:

                          print(
                              "⚠️ 返回空数据"
                          )

                  except Exception as e:

                      print(
                          "❌ 调用失败：",
                          type(e).__name__,
                          repr(e)
                      )

              if not success:

                  print("")
                  print(
                      "❌ rank 接口所有测试均失败"
                  )

          except Exception as e:

              print(
                  "❌ rank 测试异常：",
                  type(e).__name__,
                  repr(e)
              )

              traceback.print_exc()

          print("")
          print("=" * 80)
          PY

      # =========================================================
      # 6. 测试 stock_sector_fund_flow_summary
      # =========================================================
      - name: 测试板块资金流汇总接口
        run: |
          python - <<'PY'
          import akshare as ak
          import pandas as pd
          import traceback
          import inspect

          print("=" * 80)
          print("【2】测试 stock_sector_fund_flow_summary")
          print("=" * 80)

          try:

              if not hasattr(
                  ak,
                  "stock_sector_fund_flow_summary"
              ):

                  raise RuntimeError(
                      "当前 AKShare 不存在 "
                      "stock_sector_fund_flow_summary"
                  )

              func = (
                  ak.stock_sector_fund_flow_summary
              )

              print("")
              print("函数签名：")

              try:
                  print(inspect.signature(func))
              except Exception:
                  pass

              attempts = [
                  {},
                  {"symbol": "行业资金流"},
                  {"symbol": "概念资金流"},
              ]

              success = False

              for kwargs in attempts:

                  print("")
                  print("尝试参数：", kwargs)

                  try:

                      df = func(**kwargs)

                      if (
                          df is not None
                          and not df.empty
                      ):

                          print("")
                          print("✅ 调用成功")
                          print("参数：", kwargs)
                          print("数据行数：", len(df))

                          print("")
                          print("字段：")
                          print(list(df.columns))

                          print("")
                          print("前 10 行：")

                          print(
                              df.head(10)
                              .to_string(index=False)
                          )

                          df.to_csv(
                              "sector_fund_flow_summary.csv",
                              index=False,
                              encoding="utf-8-sig"
                          )

                          success = True
                          break

                      else:

                          print(
                              "⚠️ 返回空数据"
                          )

                  except Exception as e:

                      print(
                          "❌ 调用失败：",
                          type(e).__name__,
                          repr(e)
                      )

              if not success:

                  print("")
                  print(
                      "❌ summary 接口所有测试均失败"
                  )

          except Exception as e:

              print(
                  "❌ summary 测试异常：",
                  type(e).__name__,
                  repr(e)
              )

              traceback.print_exc()

          print("")
          print("=" * 80)
          PY

      # =========================================================
      # 7. 测试 stock_sector_fund_flow_hist
      # =========================================================
      - name: 测试板块历史资金流接口
        run: |
          python - <<'PY'
          import akshare as ak
          import pandas as pd
          import traceback
          import inspect

          print("=" * 80)
          print("【3】测试 stock_sector_fund_flow_hist")
          print("=" * 80)

          try:

              if not hasattr(
                  ak,
                  "stock_sector_fund_flow_hist"
              ):

                  raise RuntimeError(
                      "当前 AKShare 不存在 "
                      "stock_sector_fund_flow_hist"
                  )

              func = ak.stock_sector_fund_flow_hist

              print("")
              print("函数签名：")

              try:
                  print(inspect.signature(func))
              except Exception:
                  pass

              # -------------------------------------------------
              # 根据函数签名自动生成测试参数
              # -------------------------------------------------

              signature = inspect.signature(func)

              kwargs = {}

              for name, parameter in signature.parameters.items():

                  if name == "symbol":

                      kwargs[name] = "半导体"

                  elif name == "period":

                      kwargs[name] = "今日"

                  elif (
                      parameter.default
                      is inspect.Parameter.empty
                  ):

                      # 对必须参数做常见尝试
                      if name in (
                          "start_date",
                          "start",
                      ):

                          kwargs[name] = "20260901"

                      elif name in (
                          "end_date",
                          "end",
                      ):

                          kwargs[name] = "20260906"

              print("")
              print("自动生成测试参数：")
              print(kwargs)

              df = func(**kwargs)

              if (
                  df is None
                  or df.empty
              ):

                  print("")
                  print("⚠️ hist 返回空数据")

              else:

                  print("")
                  print("✅ hist 调用成功")

                  print("")
                  print("数据行数：", len(df))

                  print("")
                  print("字段：")

                  print(
                      list(df.columns)
                  )

                  print("")
                  print("前 20 行：")

                  print(
                      df.head(20)
                      .to_string(index=False)
                  )

                  df.to_csv(
                      "sector_fund_flow_hist.csv",
                      index=False,
                      encoding="utf-8-sig"
                  )

          except Exception as e:

              print("")
              print(
                  "❌ hist 调用失败"
              )

              print(
                  "异常类型：",
                  type(e).__name__
              )

              print(
                  "异常信息：",
                  repr(e)
              )

              traceback.print_exc()

          print("")
          print("=" * 80)
          PY

      # =========================================================
      # 8. 汇总测试结果
      # =========================================================
      - name: 汇总测试结果
        if: always()
        run: |
          echo "=============================================="
          echo "第六步板块资金流测试文件"
          echo "=============================================="

          ls -lh *.csv 2>/dev/null || true

          echo ""
          echo "如果生成 CSV，说明对应接口至少返回了数据。"

      # =========================================================
      # 9. 上传测试结果
      # =========================================================
      - name: 上传板块资金流测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sector-fund-flow-test
          path: |
            sector_fund_flow_rank.csv
            sector_fund_flow_summary.csv
            sector_fund_flow_hist.csv
          if-no-files-found: ignore
