name: AlphaSift 每日选股

on:
  workflow_dispatch:

  # 北京时间周一至周五 15:30
  # GitHub Actions 使用 UTC
  # 北京时间 = UTC + 8
  schedule:
    - cron: "30 7 * * 1-5"

jobs:
  alphasift:

    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: 1. Checkout
        uses: actions/checkout@v4

      # =========================================================
      # 2. Setup Python
      # =========================================================
      - name: 2. Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =========================================================
      # 3. Install AlphaSift
      # =========================================================
      - name: 3. Install AlphaSift
        run: |
          pip install -e .

      # =========================================================
      # 4. List strategies
      # =========================================================
      - name: 4. List strategies
        run: |
          alphasift strategies

      # =========================================================
      # 5. Daily screening
      # =========================================================
      - name: 5. Daily screening
        run: |
          alphasift screen dual_low --no-llm --save-run

      # =========================================================
      # 6. Find latest saved run
      # =========================================================
      - name: 6. Find latest AlphaSift run
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import os

          run_dir = Path("data/runs")

          if not run_dir.exists():
              raise SystemExit("错误：data/runs 目录不存在")

          files = list(run_dir.glob("*.json"))

          if not files:
              raise SystemExit("错误：没有找到 AlphaSift run JSON")

          # 找最新生成的 run
          latest = max(files, key=lambda p: p.stat().st_mtime)

          print("最新 run 文件：")
          print(latest)

          # 检查 JSON 是否正常
          with latest.open("r", encoding="utf-8") as f:
              data = json.load(f)

          print("Run ID：", data.get("run_id", "unknown"))
          print("Strategy：", data.get("strategy", "unknown"))

          # 保存给下一步使用
          with open(
              os.environ["GITHUB_ENV"],
              "a",
              encoding="utf-8"
          ) as env:
              env.write(f"ALPHASIFT_RUN_FILE={latest}\n")

          print("ALPHASIFT_RUN_FILE =", latest)
          PY

      # =========================================================
      # 7. Extract Top 5 and send to Feishu
      # =========================================================
      - name: 7. Send Top 5 to Feishu
        if: success()
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import json
          import os
          import requests

          # =====================================================
          # 读取飞书 Webhook
          # =====================================================
          webhook = os.environ.get("FEISHU_WEBHOOK_URL")

          if not webhook:
              print("警告：没有配置 FEISHU_WEBHOOK_URL")
              print("跳过飞书通知")
              raise SystemExit(0)

          # =====================================================
          # 读取最新 AlphaSift run
          # =====================================================
          run_file = os.environ.get("ALPHASIFT_RUN_FILE")

          if not run_file:
              raise SystemExit(
                  "错误：没有找到 ALPHASIFT_RUN_FILE"
              )

          print("读取 run：", run_file)

          with open(
              run_file,
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          # =====================================================
          # 基本信息
          # =====================================================
          run_id = data.get("run_id", "unknown")
          strategy = data.get("strategy", "dual_low")
          snapshot_source = data.get(
              "snapshot_source",
              "unknown"
          )

          llm_ranked = data.get(
              "llm_ranked",
              False
          )

          post_analyzers = data.get(
              "post_analyzers",
              []
          )

          # =====================================================
          # 寻找股票列表
          #
          # 不同版本 AlphaSift 可能使用不同字段名称，
          # 所以这里兼容多个常见字段。
          # =====================================================
          candidates = None

          possible_fields = [
              "picks",
              "candidates",
              "results",
              "ranked_candidates",
              "selected_stocks",
              "stocks",
              "items",
              "top_picks",
          ]

          for field in possible_fields:
              value = data.get(field)

              if isinstance(value, list) and value:
                  candidates = value
                  print(
                      f"找到股票列表字段：{field}"
                  )
                  break

          # =====================================================
          # 如果顶层没有股票列表，检查常见嵌套结构
          # =====================================================
          if candidates is None:

              nested_fields = [
                  "screen_result",
                  "screen",
                  "result",
                  "selection",
                  "output",
                  "portfolio",
              ]

              for parent_field in nested_fields:

                  parent = data.get(parent_field)

                  if not isinstance(parent, dict):
                      continue

                  for field in possible_fields:

                      value = parent.get(field)

                      if (
                          isinstance(value, list)
                          and value
                      ):
                          candidates = value

                          print(
                              "找到嵌套股票列表："
                              f"{parent_field}.{field}"
                          )

                          break

                  if candidates is not None:
                      break

          # =====================================================
          # 最终仍然找不到股票
          # =====================================================
          if candidates is None:

              print(
                  "错误：没有在 run JSON 中找到股票列表。"
              )

              print(
                  "Run JSON 顶层字段："
              )

              print(
                  list(data.keys())
              )

              print(
                  json.dumps(
                      data,
                      ensure_ascii=False,
                      indent=2
                  )[:20000]
              )

              raise SystemExit(1)

          # =====================================================
          # 按排名排序
          # =====================================================
          def rank_value(stock):

              if not isinstance(stock, dict):
                  return 999999

              value = (
                  stock.get("rank")
                  or stock.get("ranking")
                  or stock.get("position")
              )

              try:
                  return int(value)
              except Exception:
                  return 999999

          candidates = sorted(
              candidates,
              key=rank_value
          )

          # 只取 Top 5
          top5 = candidates[:5]

          if not top5:
              raise SystemExit(
                  "错误：没有找到 Top 5 股票"
              )

          # =====================================================
          # 格式化数字
          # =====================================================
          def fmt(value, digits=2):

              if value is None:
                  return "-"

              try:
                  return f"{float(value):.{digits}f}"

              except Exception:
                  return str(value)

          # =====================================================
          # 构造飞书消息
          # =====================================================
          lines = []

          lines.append(
              "📊 AlphaSift 每日选股"
          )

          lines.append("")

          lines.append(
              f"策略：{strategy}（双低选股）"
          )

          lines.append(
              f"数据源：{snapshot_source}"
          )

          lines.append(
              f"LLM：{'已启用' if llm_ranked else '未启用'}"
          )

          if post_analyzers:
              lines.append(
                  "后置分析："
                  + ", ".join(
                      str(x)
                      for x in post_analyzers
                  )
              )

          lines.append(
              f"Run ID：{run_id}"
          )

          lines.append("")

          lines.append(
              "🏆 今日 Top 5"
          )

          lines.append("")

          # =====================================================
          # Top 5
          # =====================================================
          for index, stock in enumerate(
              top5,
              start=1
          ):

              if not isinstance(stock, dict):
                  continue

              code = (
                  stock.get("code")
                  or stock.get("symbol")
                  or stock.get("stock_code")
                  or "-"
              )

              name = (
                  stock.get("name")
                  or stock.get("stock_name")
                  or "-"
              )

              final_score = (
                  stock.get("final_score")
                  if stock.get("final_score")
                  is not None
                  else stock.get("score")
              )

              screen_score = stock.get(
                  "screen_score"
              )

              price = (
                  stock.get("price")
                  or stock.get("close")
                  or stock.get("latest_price")
              )

              change_pct = (
                  stock.get("change_pct")
                  if stock.get("change_pct")
                  is not None
                  else stock.get("change")
              )

              pe = (
                  stock.get("pe_ratio")
                  if stock.get("pe_ratio")
                  is not None
                  else stock.get("pe")
              )

              pb = (
                  stock.get("pb_ratio")
                  if stock.get("pb_ratio")
                  is not None
                  else stock.get("pb")
              )

              risk = (
                  stock.get("risk_level")
                  or stock.get("risk")
                  or "-"
              )

              lines.append(
                  f"{index}️⃣ {name}（{code}）"
              )

              lines.append(
                  f"   ⭐ 最终评分："
                  f"{fmt(final_score, 1)}"
              )

              if screen_score is not None:
                  lines.append(
                      f"   筛选评分："
                      f"{fmt(screen_score, 1)}"
                  )

              lines.append(
                  f"   💰 价格："
                  f"{fmt(price, 2)}"
              )

              lines.append(
                  f"   📈 涨跌幅："
                  f"{fmt(change_pct, 2)}%"
              )

              lines.append(
                  f"   PE："
                  f"{fmt(pe, 2)}"
              )

              lines.append(
                  f"   PB："
                  f"{fmt(pb, 2)}"
              )

              lines.append(
                  f"   风险：{risk}"
              )

              lines.append("")

          lines.append(
              "━━━━━━━━━━━━━━"
          )

          lines.append(
              "✅ AlphaSift 自动选股完成"
          )

          lines.append(
              "⚠️ 以上为程序筛选结果，不构成投资建议。"
          )

          message = "\n".join(lines)

          # =====================================================
          # 输出消息，方便 Actions 检查
          # =====================================================
          print("")
          print(
              "========== 飞书消息 =========="
          )
          print(message)
          print(
              "=============================="
          )
          print("")

          # =====================================================
          # 发送飞书
          # =====================================================
          payload = {
              "msg_type": "text",
              "content": {
                  "text": message
              }
          }

          response = requests.post(
              webhook,
              json=payload,
              timeout=20
          )

          print(
              "Feishu HTTP status:",
              response.status_code
          )

          print(
              "Feishu response:",
              response.text
          )

          response.raise_for_status()

          # =====================================================
          # 检查飞书 API 返回
          # =====================================================
          try:

              result = response.json()

              code = result.get(
                  "code"
              )

              if code not in (
                  None,
                  0
              ):

                  raise RuntimeError(
                      "飞书 API 返回错误："
                      + str(result)
                  )

          except ValueError:
              pass

          print("")
          print(
              "✅ Top 5 已成功发送到飞书"
          )
          PY
