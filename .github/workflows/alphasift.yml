                          )

                  })


              concept_details.sort(

                  key=lambda x:
                      x["net"]
                      if x["net"] is not None
                      else -999999,

                  reverse=True

              )


              concept_net = None


              if concept_details:

                  concept_net = (
                      concept_details[0]["net"]
                  )


              # =================================================
